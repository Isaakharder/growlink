<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f7660" />
    <meta name="description" content="Greenhouse operations platform" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <!-- No <link rel="manifest">: this build is loaded inside the Capacitor
         iOS shell, not a browser — a web app manifest has no role there,
         and omitting it removes any chance of it triggering PWA/service-worker
         behavior natively (see vite.ios.config.ts, which excludes
         vite-plugin-pwa from this build entirely). -->
    <title>GrowLink Mobile</title>
  </head>
  <!-- native-shell: scopes src/index.css's overscroll-background fix to
       this entry only, so it never affects index.html (desktop) or
       mobile.html (the web/PWA shell) — see the ".native-shell" rule in
       index.css. -->
  <body class="native-shell">
    <div id="root"></div>
    <script type="module" src="/src/main.native.tsx"></script>
  </body>
</html>
