<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7660" />
    <meta name="description" content="Greenhouse operations platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GrowLink" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var isMobileApp = window.location.pathname.indexOf("/mobile") === 0;
        var manifestLink = document.getElementById("app-manifest");
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');

        if (manifestLink) {
          manifestLink.setAttribute(
            "href",
            isMobileApp ? "/manifest-mobile.webmanifest" : "/manifest.webmanifest"
          );
        }

        if (appleTitle) {
          appleTitle.setAttribute("content", isMobileApp ? "GrowLink Mobile" : "GrowLink");
        }
      })();
    </script>
    <title>GrowLink</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
